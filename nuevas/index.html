<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">
  <title>DIGIFEST 2026 · Comparador</title>
  <!-- Las propuestas nuevas ahora están en el comparador único de la raíz (opciones 6 a 9). -->
  <meta http-equiv="refresh" content="0; url=../?v=6">
  <script>
    // ?v=1…4 del comparador antiguo de /nuevas/ equivale a 6…9 en el comparador único.
    var v = parseInt(new URLSearchParams(location.search).get('v'), 10);
    location.replace('../?v=' + (v >= 1 && v <= 4 ? v + 5 : 6));
  </script>
</head>
<body>
  <p>Las propuestas ahora están en el <a href="../?v=6">comparador de DIGIFEST 2026</a>.</p>
</body>
